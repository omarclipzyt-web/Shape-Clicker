<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shape Clicker</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<meta name="theme-color" content="#6a00ff">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: linear-gradient(#0b0016, #000);
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
}

#shape {
  width: 150px;
  height: 150px;
  background: #8a2be2;
  border-radius: 50%;
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 40px #8a2be2;
  cursor: pointer;
  transition: transform 0.1s;
}

#shape:active {
  transform: translate(-50%, -50%) scale(0.9);
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
}

.panel {
  background: rgba(0,0,0,0.6);
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 10px;
}

button {
  width: 160px;
  margin-top: 5px;
  padding: 6px;
  border-radius: 8px;
  border: none;
  background: #6a00ff;
  color: white;
  font-size: 14px;
}
button:disabled { opacity: 0.4; }
</style>
</head>
<body>

<div id="game">
  <div id="shape"></div>

  <div id="ui">
    <div class="panel">Points: <span id="points">0</span></div>

    <div class="panel">
      <b>Shapes</b><br>
      <button onclick="buyShape('circle',0)">Circle (free)</button>
      <button onclick="buyShape('square',10)">Square (10)</button>
      <button onclick="buyShape('triangle',30)">Triangle (30)</button>
      <button onclick="buyShape('rectangle',20)">Rectangle (20)</button>
    </div>

    <div class="panel">
      <b>Upgrades</b><br>
      <button onclick="buyUpgrade()">+1 Power (<span id="upgradePrice">10</span>)</button>
    </div>
  </div>
</div>

<script>
let points = 0;
let power = 1;
let upgradePrice = 10;
let currentShape = 'circle';

const shape = document.getElementById('shape');
const pointsSpan = document.getElementById('points');
const upgradePriceSpan = document.getElementById('upgradePrice');

shape.onclick = () => {
  points += power;
  pointsSpan.textContent = points;
};

function buyUpgrade() {
  if (points >= upgradePrice) {
    points -= upgradePrice;
    power++;
    upgradePrice = Math.floor(upgradePrice * 1.6);
    upgradePriceSpan.textContent = upgradePrice;
    pointsSpan.textContent = points;
  }
}

function buyShape(type, cost) {
  if (points >= cost) {
    points -= cost;
    currentShape = type;
    applyShape();
    pointsSpan.textContent = points;
  }
}

function applyShape() {
  shape.style = "";
  shape.className = "";
  shape.style.background = "#8a2be2";
  shape.style.boxShadow = "0 0 40px #8a2be2";

  if (currentShape === "square") shape.style.borderRadius = "10px";
  if (currentShape === "triangle") {
    shape.style.width = "0";
    shape.style.height = "0";
    shape.style.borderLeft = "75px solid transparent";
    shape.style.borderRight = "75px solid transparent";
    shape.style.borderBottom = "150px solid #8a2be2";
    shape.style.background = "none";
    shape.style.boxShadow = "none";
  }
  if (currentShape === "rectangle") {
    shape.style.width = "220px";
    shape.style.height = "120px";
    shape.style.borderRadius = "12px";
  }
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
