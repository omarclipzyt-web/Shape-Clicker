<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shape Clicker Galaxy</title>
<style>
body{margin:0;font-family:system-ui;background:radial-gradient(circle at top,#050510,#000);color:white;overflow:hidden;transition:background 2s;}
body.galaxy{background:
radial-gradient(circle at 30% 30%, rgba(255,0,255,0.15), transparent 40%),
radial-gradient(circle at 70% 60%, rgba(0,150,255,0.15), transparent 45%),
radial-gradient(circle at center, #020024, #090979, #000);}
#top{position:fixed;top:0;width:100%;height:50px;background:rgba(0,0,0,0.6);display:flex;align-items:center;padding:0 10px;z-index:5;}
button{margin-top:5px;padding:6px 10px;border-radius:8px;border:none;background:#222;color:white;}
button:disabled{opacity:0.4}
#score{flex:1;text-align:center;}
#shop,#shapes,#leaderboard{position:fixed;top:50px;width:240px;height:calc(100%-50px);background:rgba(15,15,30,0.95);padding:10px;display:none;overflow-y:auto;z-index:5;}
#shop{left:0;} #shapes{right:0;} #leaderboard{left:50%;transform:translateX(-50%);}
.item{background:rgba(255,255,255,0.08);margin-bottom:10px;padding:10px;border-radius:10px;text-align:center;}
#target{position:absolute;border-radius:50%;animation:pulse 1.5s infinite alternate;}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}
.triangle{width:0!important;height:0!important;background:none!important;border-left:50px solid transparent;border-right:50px solid transparent;border-bottom:100px solid red;}
.heart{width:100px;height:90px;background:red;transform:rotate(-45deg);border-radius:10px 10px 0 0;position:absolute;}
.heart::before,.heart::after{content:"";width:100px;height:90px;background:red;border-radius:50%;position:absolute;}
.heart::before{top:-50px;left:0;} .heart::after{left:50px;top:0;}
#teleport{position:fixed;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;font-size:2em;color:#9df;z-index:10;text-shadow:0 0 20px #9df;}
</style>
</head>
<body>

<div id="teleport">Teleporting To The Galaxy...</div>

<div id="top">
<button onclick="toggle('shop')">Shop</button>
<button onclick="toggle('shapes')">Shapes</button>
<button onclick="toggle('leaderboard')">Leaderboard</button>
<div id="score">Score: 0 | Streak: 0</div>
</div>

<div id="shop"></div>
<div id="shapes"></div>
<div id="leaderboard"></div>
<div id="target"></div>

<script>
let score=0,streak=0,bestScore=0,bestStreak=0;
let baseSize=150,size=150,shrinkSpeed=0.35,shape="circle",multiplier=1;
let galaxyUnlocked=false;
let autoIntervals=0;

const target=document.getElementById("target"),scoreText=document.getElementById("score"),tele=document.getElementById("teleport");
const shopDiv=document.getElementById("shop"),shapesDiv=document.getElementById("shapes"),lbDiv=document.getElementById("leaderboard");

const shapes={circle:{price:0,owned:true},square:{price:10,owned:false},rectangle:{price:20,owned:false},triangle:{price:30,owned:false},heart:{price:50,owned:false}};

const upgrades={
slow:{name:"Slower Shrink",base:5,level:0},
big:{name:"Bigger Size",base:5,level:0},
multi:{name:"Score Multiplier",base:10,level:0},
auto:{name:"Auto Clicker",base:15,level:0},
shield:{name:"Streak Shield",base:10,level:0},
glow:{name:"Glow Boost",base:10,level:0},
diff:{name:"Slow Difficulty",base:15,level:0},
particles:{name:"Particle Storm",base:5,level:0},
spawn:{name:"Wide Spawn",base:5,level:0},
bonus:{name:"Streak Bonus",base:20,level:0}
};

const upgradeCost = u => Math.floor(u.base * Math.pow(1.6, u.level));

function toggle(id){
const e=document.getElementById(id);
e.style.display=e.style.display==="none"?"block":"none";
}

function update(){
scoreText.textContent=`Score: ${score} | Streak: ${streak}`;
bestScore=Math.max(bestScore,score);
bestStreak=Math.max(bestStreak,streak);
render();
}

function randomColor(){
return galaxyUnlocked ? `hsl(${200+Math.random()*120},90%,65%)` : `hsl(${Math.random()*360},90%,60%)`;
}

function spawn(){
size=baseSize;
const c=randomColor();
target.className="";
target.style.background=c;
target.style.boxShadow=`0 0 ${25+upgrades.glow.level*12}px ${c}`;
target.style.width=size+"px";
target.style.height=size+"px";
target.style.borderRadius="50%";

if(shape==="square") target.style.borderRadius="0";
if(shape==="rectangle"){target.style.borderRadius="10px";target.style.width=size*1.6+"px";}
if(shape==="triangle"){target.className="triangle";target.style.borderBottomColor=c;}
if(shape==="heart"){target.className="heart";target.style.background=c;}

target.style.left=Math.random()*(innerWidth-size)+"px";
target.style.top=Math.random()*(innerHeight-size-60)+60+"px";
}

target.onclick=()=>{
score+=multiplier + upgrades.bonus.level;
streak++;
shrinkSpeed+=0.01;
checkGalaxy();
update();
spawn();
};

function shrink(){
size-=shrinkSpeed;
if(size<=0){
if(upgrades.shield.level===0) streak=0;
update();
spawn();
}else if(shape!=="triangle"){
target.style.width=size+"px";
target.style.height=size+"px";
}
}

function checkGalaxy(){
if(score>=100 && !galaxyUnlocked){
galaxyUnlocked=true;
document.body.classList.add("galaxy");
tele.style.display="flex";
setTimeout(()=>tele.style.display="none",2000);
}
}

function buyShape(key){
const s=shapes[key];
if(!s.owned && score<s.price) return;
if(!s.owned){score-=s.price; s.owned=true;}
shape=key;
update();
spawn();
}

function buyUpgrade(key){
const u=upgrades[key];
const cost = upgradeCost(u);
if(score < cost) return;
score -= cost;
u.level++;

if(key==="auto"){
autoIntervals++;
setInterval(()=>target.click(), Math.max(800, 2500 - autoIntervals*300));
}
if(key==="slow") shrinkSpeed=Math.max(0.05, shrinkSpeed - 0.04);
if(key==="big") baseSize+=10;
if(key==="multi") multiplier++;
update();
}

function render(){
shopDiv.innerHTML="<h3>Upgrades</h3>";
for(const k in upgrades){
const u=upgrades[k];
shopDiv.innerHTML+=`
<div class="item">
${u.name} (Lvl ${u.level})<br>
<button ${score<upgradeCost(u)?"disabled":""} onclick="buyUpgrade('${k}')">Buy (${upgradeCost(u)})</button>
</div>`;
}

shapesDiv.innerHTML="<h3>Shapes</h3>";
for(const k in shapes){
const s=shapes[k];
let label=s.owned?(shape===k?"Selected":"Select"):`Buy (${s.price})`;
shapesDiv.innerHTML+=`
<div class="item">
${k.charAt(0).toUpperCase()+k.slice(1)}<br>
<button ${(!s.owned && score<s.price)?"disabled":""} onclick="buyShape('${k}')">${label}</button>
</div>`;
}

lbDiv.innerHTML=`
<h3>Leaderboard</h3>
<div class="item">Best Score<br>${bestScore}</div>
<div class="item">Best Streak<br>${bestStreak}</div>`;
}

spawn();
update();
setInterval(shrink,20);
</script>
</body>
</html>
